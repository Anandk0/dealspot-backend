spring:
  application:
    name: dealspot-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/dealspot}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${PORT:8080}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:dealspot-super-secret-key-change-in-production-min-256-bits-long}
  expiration: 86400000  # 24 hours

# Cloudinary Configuration
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:your-cloud-name}
  api-key: ${CLOUDINARY_API_KEY:your-api-key}
  api-secret: ${CLOUDINARY_API_SECRET:your-api-secret}

# CORS
app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,https://dealspot-8w5z.onrender.com}
