spring:
  application:
    name: dealspot-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/dealspot}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${PORT:8080}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:dealspot-super-secret-key-change-in-production-min-256-bits-long-here}
  access-expiration: 900000       # 15 minutes
  refresh-expiration: 604800000   # 7 days

# Cloudinary
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:your-cloud-name}
  api-key: ${CLOUDINARY_API_KEY:your-api-key}
  api-secret: ${CLOUDINARY_API_SECRET:your-api-secret}

# Razorpay
razorpay:
  key-id: ${RAZORPAY_KEY_ID:rzp_test_placeholder}
  key-secret: ${RAZORPAY_KEY_SECRET:placeholder_secret}
  contact-unlock-amount: 5000  # ₹50 in paise

# Google reCAPTCHA v3
recaptcha:
  secret-key: ${RECAPTCHA_SECRET_KEY:placeholder}
  threshold: 0.5
  enabled: ${RECAPTCHA_ENABLED:false}

# OTP (stub — plug in MSG91/Twilio later)
otp:
  enabled: ${OTP_ENABLED:false}
  expiry-minutes: 5

# Email (Gmail SMTP)
spring.mail:
  host: smtp.gmail.com
  port: 587
  username: ${MAIL_USERNAME:placeholder@gmail.com}
  password: ${MAIL_PASSWORD:placeholder}
  properties:
    mail.smtp.auth: true
    mail.smtp.starttls.enable: true

# Email OTP
email-otp:
  enabled: ${EMAIL_OTP_ENABLED:false}
  from: ${MAIL_USERNAME:placeholder@gmail.com}
  subject: "Deal Spot - OTP Verification"

# CORS
app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,https://dealspot-8w5z.onrender.com,https://6pl77msv-3000.inc1.devtunnels.ms}
