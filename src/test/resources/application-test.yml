spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  flyway:
    enabled: false

jwt:
  secret: test-secret-key-must-be-at-least-256-bits-long-for-hmac-sha256-algorithm
  access-expiration: 900000
  refresh-expiration: 604800000

cloudinary:
  cloud-name: test
  api-key: test
  api-secret: test

razorpay:
  key-id: rzp_test_key
  key-secret: rzp_test_secret
  contact-unlock-amount: 5000

recaptcha:
  secret-key: test
  threshold: 0.5
  enabled: false

otp:
  enabled: false
  expiry-minutes: 5

app:
  cors:
    allowed-origins: http://localhost:3000
